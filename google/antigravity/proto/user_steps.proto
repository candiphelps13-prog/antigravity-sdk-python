edition = "2024";

package genai;

import "google/antigravity/proto/content.proto";
import "google/antigravity/proto/genai_json_annotations.proto";

message UserInputContent {
  oneof type {
    option (gaos.parsing.subtype_source) = true;

    .genai.TextContent text = 10;
    .genai.ImageContent image = 11;
    .genai.AudioContent audio = 12;
    .genai.DocumentContent document = 13;
    .genai.VideoContent video = 14;
  }
}
message LiveUserInputStep {
  .genai.UserInputContent content = 1;
}
message LiveFunctionResultStep {
  oneof result {
    option (gaos.parsing.is_union) = true;

    .genai.Struct struct_result = 10;
    .genai.ContentList content_list = 11 [
      (gaos.parsing.json_discriminator_values) = "text",
      (gaos.parsing.json_discriminator_values) = "image"
    ];
    string string_result = 12;
  }
  string call_id = 1;
  string name = 2;
  bool is_error = 3;
  bytes signature = 4;
}
